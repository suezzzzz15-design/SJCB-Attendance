<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJCBI - Welcome Josephian</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Background Image 1 (School) applied to the body */
      background-image: url('sjcbi-bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Standard container for both 'pages' */
    .sjcbi-container {
      background-color: rgba(255, 255, 255, 0.95); /* Slight transparency */
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.4s ease-in-out;
    }

    /* Logo Styling used in both sections */
    .school-logo {
      width: 150px;
      height: 150px;
      margin: 20px 0;
      object-fit: contain;
    }

    /* ========================================= */
    /* Page 1: Welcome Screen Styles             */
    /* ========================================= */
    #welcome-page {
      padding: 40px;
      text-align: center;
      display: flex; /* Initially visible */
      flex-direction: column;
      align-items: center;
    }

    .welcome-title {
      color: #1a4d2e; /* Deep SJCBI Green */
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .college-name {
      color: #4b5563; /* Sub subtle gray */
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .begin-btn {
      background-color: #1a4d2e; /* Deep SJCBI Green */
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }

    .begin-btn:hover {
      background-color: #143a22; /* Darker green on hover */
    }

    .begin-btn:active {
      transform: translateY(2px);
    }

    /* ========================================= */
    /* Page 2: Form Screen Styles                */
    /* ========================================= */
    #form-page {
      display: none; /* Initially hidden */
      width: 100%;
    }

    /* Header for the Form Section */
    .form-header-section {
      width: 100%;
      background-color: #1a4d2e; /* SJCBI Green Header */
      color: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid #143a22; /* Darker Green accent */
    }

    .form-header-section h2 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .form-header-section p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* Form Wrapper and Iframe */
    .form-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    iframe {
      width: 100%;
      max-width: 640px; /* Constraints width for modern look */
      height: 1224px;
      border: none;
    }

    /* Simple visibility utility class controlled by JS */
    .hidden {
      display: none !important;
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .welcome-title {
        font-size: 1.9rem;
      }
      .school-logo {
        width: 120px;
        height: 120px;
      }
      iframe {
        height: 1000px; /* Reduced height on mobile */
      }
    }
  </style>
</head>
<body>

  <!-- ========================================= -->
  <!-- PAGE 1: WELCOME SCREEN                    -->
  <!-- ========================================= -->
  <div id="welcome-page" class="sjcbi-container">
    <!-- Updated Logo Image Source -->
    <img src="489030044_1304453488125142_8678310138783682019_n.jpg" alt="SJCBI Logo" class="school-logo">
    
    <h1 class="welcome-title">Welcome Josephian</h1>
    <p class="college-name">St. Joseph's College of Baggao, Inc.</p>
    
    <button class="begin-btn" id="start-btn">Begin</button>
  </div>


  <!-- ========================================= -->
  <!-- PAGE 2: FORM SCREEN (Initially Hidden)  -->
  <!-- ========================================= -->
  <div id="form-page" class="sjcbi-container">
    <!-- Header/Context bar above the form -->
    <div class="form-header-section">
      <h2>Student Portal</h2>
      <p>St. Joseph's College of Baggao, Inc.</p>
    </div>

    <!-- Embedded Google Form -->
    <div class="form-wrapper">
      <iframe 
        src="https://docs.google.com/forms/d/e/1FAIpQLSfzQaK6_SpmU9Qi71r3YBDCmjl_LA5CtHJDVE179dtztWcirg/viewform?embedded=true" 
        width="640" 
        height="1224" 
        frameborder="0" 
        marginheight="0" 
        marginwidth="0">
        Loading…
      </iframe>
    </div>
  </div>

  <script>
    // Simple JavaScript to handle the page switch
    const startButton = document.getElementById('start-btn');
    const welcomePage = document.getElementById('welcome-page');
    const formPage = document.getElementById('form-page');

    startButton.addEventListener('click', function() {
      // 1. Hide the Welcome Page
      welcomePage.classList.add('hidden');
      
      // 2. Show the Form Page
      formPage.style.display = 'flex';
      
      // 3. (Optional) Scroll to the top of the new page
      window.scrollTo(0, 0);
    });
  </script>

</body>
</html>
